<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174c43"><meta name="description" content="초등학교 4학년 과학 기후 변화와 우리 생활 통합 탐구실. 실제 자료와 움직이는 마을, 해수면 입체 모형으로 탐구해요.">
  <title>기후가 바뀌면, 우리 마을은?</title>
  <link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="action-village.css"><link rel="stylesheet" href="worksheets.css">
</head>
<body>
 <header class="topbar">
  <button class="brand" data-go="home" aria-label="처음 화면"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#237b67"/><path d="M7 18 16 9l7 2 1 8 10 3-9 13-5-7-8-1Z" fill="#d9edb6"/><path d="m5 29 7-2 7 7" fill="none" stroke="#fff" stroke-width="2"/></svg><span>우리 마을 <b>기후 탐구실</b><small>4학년 과학 · 기후 변화와 우리 생활</small></span></button>
  <nav id="lessonNav" aria-label="탐구 메뉴"></nav>
  <div class="toptools"><button class="iconbtn" id="guideBtn" aria-label="수업 안내">?</button><button class="subtle" id="teacherBtn">수업 도구</button><button class="record-btn" id="recordBtn">내 탐구 기록지 <span id="evidenceCount" aria-label="모은 증거 수">0</span></button></div>
 </header>
 <main id="app">
  <canvas id="village" aria-label="기후 현상과 생활 변화를 관찰하는 입체 마을" role="img"></canvas>
  <div id="home"></div><div id="world" hidden></div>
  <section id="actionVillage" hidden aria-label="마을에서 행동하기"></section>
  <section id="seaLab" hidden aria-label="해수면 상승 실험실"></section>
  <section id="sceneHead" class="scene-head"></section>
  <div id="sceneLabels" class="scene-labels"></div>
  <div id="sceneTools" class="scene-tools"></div>
  <div id="sceneStatus" class="scene-status"></div>
  <aside id="panel" class="panel" aria-label="탐구 활동"></aside>
  <div id="dock" class="dock"></div>
  <div id="modelNotice" class="model-notice">움직이는 장면은 학습용 모형이에요. 실제 관측 수치는 ‘자료’에서 확인해요.</div>
 </main>
 <dialog id="modal"><div id="modalContent"></div></dialog>
 <div id="toast" role="status" aria-live="polite"></div>
 <template id="seaLessonTemplate">
<link rel="stylesheet" href="sea/style.css">
<header class="app-head">
 <div class="brand"><img src="sea/icon.svg" width="47" height="47" alt=""><div><small>04　교과서 98~99쪽</small><h1>해수면 상승 실험실</h1></div></div>
 <nav aria-label="수업 도구"><button id="principle" class="soft"><i data-icon="bulb"></i><span>실험 원리</span></button><button id="openNotes" class="nav-note"><i data-icon="book"></i><span>탐구 노트</span></button></nav>
</header>
<div class="lab-main">
 <section class="tank-panel" aria-labelledby="tankTitle">
  <div class="tank-heading"><div><div class="eyeline"><span></span>해수면 시뮬레이션</div><h2 id="tankTitle">해안 마을 수조</h2></div><button id="nameToggle" class="name-toggle" aria-pressed="true"><i data-icon="tag"></i>건물 이름<span class="switch"></span></button></div>
  <div class="viewbox"><canvas id="tank" aria-label="높은 숲에서 낮은 해안으로 이어지는 입체 수조. 건물을 놓거나 손가락으로 돌릴 수 있어요."></canvas></div>
  <div class="tank-tools">
   <div class="hint"><i data-icon="hand"></i><span id="hint">손가락으로 밀어 마을을 돌려 보세요.</span></div>
   <div class="camera"><button id="zoomOut" title="축소" aria-label="축소"><i data-icon="minus"></i></button><button id="zoomIn" title="확대" aria-label="확대"><i data-icon="plus"></i></button><button id="cameraHome" title="기본 시점" aria-label="기본 시점"><i data-icon="fit"></i></button></div>
  </div>
  <div class="reading">
   <div class="reading-name"><i data-icon="pulse"></i><strong>관찰 현황</strong></div>
   <div class="measure"><span>물 높이</span><strong><b id="currentLevel">0</b><em>단계</em></strong></div>
   <div class="measure"><span>잠긴 건물</span><strong><b id="wetCount">0</b><em>개</em></strong></div>
   <div class="measure"><span>전체 건물</span><strong><b id="total">7</b><em>개</em></strong></div>
  </div>
 </section>
 <aside aria-label="실험 도구">
  <section class="water-card card">
   <div class="card-head"><h2><span class="sym blue"><i data-icon="drop"></i></span>물 높이 조절</h2><output id="target" for="level">0단계</output></div>
   <div class="slider-wrap"><input id="level" type="range" min="0" max="10" step="1" value="0" aria-label="목표 물 높이"><div class="scale"><span>0단계</span><span>5</span><span>10단계</span></div></div>
   <div class="water-buttons"><button id="less" class="subtle"><i data-icon="minus"></i>물 빼기</button><button id="more" class="primary"><i data-icon="plus"></i>물 넣기</button></div>
  </section>
  <section class="build-card card">
   <div class="card-head"><h2><span class="sym ochre"><i data-icon="village"></i></span>건물 배치</h2><div class="layout-tools"><button id="removeLast" class="tiny" aria-label="마지막 건물 지우기" title="마지막 건물 지우기">−</button><button id="undo" class="tiny"><i data-icon="undo"></i>되돌리기</button></div></div>
   <p>건물을 고른 뒤, 놓을 땅을 눌러요.</p><div id="buildings" class="catalog"></div>
   <div class="modes"><button id="orbit" aria-pressed="true"><i data-icon="orbit"></i>돌려 보기</button><button id="move" aria-pressed="false"><i data-icon="move"></i>옮기기</button></div>
  </section>
  <div class="actions"><button id="record" class="record"><i data-icon="note"></i>장면 기록하기</button><button id="reset" class="reset" aria-label="수조 초기화" title="수조 초기화"><i data-icon="reset"></i></button></div>
  <p class="record-tip" id="recordTip"></p>
 </aside>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close" aria-label="닫기"><i data-icon="close"></i></button></div><div id="dialogBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
 </template>
 <script src="cases.js"></script><script src="model.js"></script><script src="actions.js"></script><script src="buildings.js"></script><script src="curriculum.js"></script><script src="world-photos.js"></script><script src="water.js"></script><script src="scene.js"></script><script src="sea/scene.js"></script><script src="sea/notebook.js"></script><script src="sea/lab.js"></script><script src="action-village.js"></script><script src="lesson-worksheets.js"></script><script src="worksheet-paper.js"></script><script src="worksheet-dialog.js"></script><script src="app.js"></script>
</body>
</html>
